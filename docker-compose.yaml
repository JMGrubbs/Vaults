services:
  db-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - auth_redis_cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_MAIN_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MAIN_USER} -d ${POSTGRES_MAIN_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file:
      - ./app/.env
    environment:
      OAUTH_CLIENTS_JSON: "${OAUTH_CLIENTS_JSON:-[]}"
      AUTHORIZATION_CODE_EXPIRE_SECONDS: ${AUTHORIZATION_CODE_EXPIRE_SECONDS:-120}
      OAUTH_LOGIN_RATE_WINDOW_SECONDS: ${OAUTH_LOGIN_RATE_WINDOW_SECONDS:-300}
      OAUTH_LOGIN_EMAIL_LIMIT: ${OAUTH_LOGIN_EMAIL_LIMIT:-5}
      OAUTH_LOGIN_IP_LIMIT: ${OAUTH_LOGIN_IP_LIMIT:-300}
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app
    depends_on:
      postgres:
        condition: service_healthy
      db-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5175:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  auth_redis_cache:
  frontend_node_modules:
  postgres_data:
